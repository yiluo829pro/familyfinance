<title>Austin Vibe</title>
<style>
  :root {
    --bg: #0f0f0f;
    --bg2: #1a1a1a;
    --bg3: #242424;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0f0f0;
    --text2: #999;
    --text3: #666;
    --orange: #e8571a;
    --orange-dim: rgba(232,87,26,0.15);
    --green: #2ecc71;
    --green-dim: rgba(46,204,113,0.12);
    --red: #e74c3c;
    --red-dim: rgba(231,76,60,0.12);
    --radius: 14px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif; overscroll-behavior: none; }
  body { overflow-x: hidden; }

  /* HEADER */
  .header {
    position: sticky; top: 0; z-index: 50;
    background: rgba(15,15,15,0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 0.5px solid var(--border);
    padding: 14px 18px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .header-logo { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; flex: 1; }
  .header-logo span { color: var(--orange); }
  .back-btn {
    background: var(--bg3); border: 0.5px solid var(--border2);
    border-radius: 20px; padding: 6px 14px; font-size: 13px;
    color: var(--text2); cursor: pointer; display: flex; align-items: center; gap: 5px;
  }

  /* HOME GRID */
  .home-intro {
    padding: 20px 18px 4px;
  }
  .home-headline { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
  .home-sub { font-size: 14px; color: var(--text2); margin-top: 6px; line-height: 1.5; }
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 18px;
  }
  .cat-card {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 14px;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
    -webkit-user-select: none; user-select: none;
  }
  .cat-card:active { transform: scale(0.97); border-color: var(--border2); }
  .cat-emoji { font-size: 28px; margin-bottom: 8px; display: block; }
  .cat-name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .cat-sub { font-size: 11px; color: var(--text3); margin-top: 3px; line-height: 1.35; }
  .cat-count { font-size: 11px; color: var(--orange); margin-top: 6px; font-weight: 500; }

  /* LIST VIEW */
  .list-view { display: none; }
  .list-header {
    padding: 16px 18px 12px;
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .list-title-wrap {}
  .list-title { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .list-sub { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .share-btn {
    background: var(--orange-dim);
    border: 0.5px solid var(--orange);
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--orange);
    cursor: pointer;
    white-space: nowrap;
    display: flex; align-items: center; gap: 5px;
    flex-shrink: 0;
  }
  .share-btn:active { opacity: 0.7; }

  /* PLACE CARDS */
  .places-list { padding: 0 12px; }
  .place-card {
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 12px;
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px;
  }
  .place-rank {
    font-size: 18px; font-weight: 700; color: var(--text3);
    min-width: 28px; text-align: center; flex-shrink: 0;
  }
  .place-rank.gold { color: #f5a623; }
  .place-rank.silver { color: #aaaaaa; }
  .place-rank.bronze { color: #cd7f32; }
  .place-info { flex: 1; min-width: 0; }
  .place-name {
    font-size: 15px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .place-desc {
    font-size: 12px; color: var(--text2); margin-top: 3px;
    line-height: 1.4; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .place-addr { font-size: 11px; color: var(--text3); margin-top: 3px; }
  .place-tags { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
  .place-tag {
    font-size: 10px; background: var(--bg3); color: var(--text3);
    padding: 2px 7px; border-radius: 20px; border: 0.5px solid var(--border);
  }
  .community-badge {
    font-size: 10px; background: rgba(232,87,26,0.12); color: var(--orange);
    padding: 1px 6px; border-radius: 10px; margin-left: 6px; vertical-align: middle;
  }

  /* VOTE CONTROLS */
  .vote-col { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
  .vote-btn {
    width: 36px; height: 32px;
    background: var(--bg3); border: 0.5px solid var(--border);
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; color: var(--text2);
    transition: all .12s;
  }
  .vote-btn:active { transform: scale(0.92); }
  .vote-btn.up-voted { background: var(--green-dim); border-color: var(--green); color: var(--green); }
  .vote-btn.dn-voted { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .vote-score {
    font-size: 13px; font-weight: 700; color: var(--text);
    min-width: 36px; text-align: center; line-height: 1;
  }
  .vote-score.positive { color: var(--green); }
  .vote-score.negative { color: var(--red); }

  /* EXPAND + NOMINATE */
  .expand-row { text-align: center; padding: 10px 0 4px; }
  .expand-btn {
    background: var(--bg2); border: 0.5px solid var(--border2);
    border-radius: 20px; padding: 9px 22px;
    font-size: 13px; color: var(--text2); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .expand-btn:active { opacity: 0.7; }
  .expand-arrow { transition: transform .2s; display: inline-block; }
  .expand-arrow.open { transform: rotate(180deg); }

  .nominate-box {
    margin: 16px 12px 24px;
    background: var(--bg2);
    border: 0.5px dashed var(--border2);
    border-radius: var(--radius);
    padding: 14px;
  }
  .nom-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .nom-sub { font-size: 12px; color: var(--text3); margin-bottom: 10px; }
  .nom-inputs { display: flex; flex-direction: column; gap: 8px; }
  .nom-input {
    background: var(--bg3); border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm); padding: 10px 12px;
    font-size: 14px; color: var(--text); width: 100%;
    outline: none;
  }
  .nom-input:focus { border-color: var(--orange); }
  .nom-input::placeholder { color: var(--text3); }
  .nom-row { display: flex; gap: 8px; }
  .nom-submit {
    background: var(--orange); border: none;
    border-radius: var(--radius-sm); padding: 10px 16px;
    font-size: 14px; font-weight: 600; color: white; cursor: pointer;
    flex-shrink: 0;
  }
  .nom-submit:active { opacity: 0.8; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
    background: rgba(30,30,30,0.95); border: 0.5px solid var(--border2);
    border-radius: 20px; padding: 10px 20px;
    font-size: 13px; font-weight: 500; color: var(--text);
    opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 999;
    white-space: nowrap; max-width: 90vw;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .toast.show { opacity: 1; }

  /* PENDING DIMMED */
  .pending-place { opacity: 0.65; }

  /* SECTION DIVIDER */
  .section-label {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; color: var(--text3);
    padding: 10px 18px 6px;
  }

  /* NO SCROLL BOUNCE ON IOS */
  @supports (-webkit-overflow-scrolling: touch) {
    body { -webkit-overflow-scrolling: touch; }
  }
</style>
</head>

const VOTES_KEY = 'av_votes_v3';
const NOMS_KEY = 'av_noms_v2';

let votes = {};
let noms = {};
let currentCat = null;
let expanded = false;

try { votes = JSON.parse(localStorage.getItem(VOTES_KEY) || '{}'); } catch(e){}
try { noms = JSON.parse(localStorage.getItem(NOMS_KEY) || '{}'); } catch(e){}

function saveVotes() { try { localStorage.setItem(VOTES_KEY, JSON.stringify(votes)); } catch(e){} }
function saveNoms() { try { localStorage.setItem(NOMS_KEY, JSON.stringify(noms)); } catch(e){} }

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function getScore(catId, placeId, base) {
  const v = votes[catId + ':' + placeId];
  if (v === 'up') return base + 1;
  if (v === 'dn') return base - 1;
  return base;
}

// HOME
function renderHome() {
  currentCat = null; expanded = false;
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('list-view').style.display = 'none';
  const header = document.getElementById('app-header');
  header.innerHTML = '<div class="header-logo">Austin <span>Vibe</span></div>';

  const grid = document.getElementById('cat-grid');
  grid.innerHTML = CATS.map(c => {
    const pool = [...(PLACES[c.id] || []), ...(noms[c.id] || [])];
    return `<div class="cat-card" onclick="showList('${c.id}')">
      <span class="cat-emoji">${c.emoji}</span>
      <div class="cat-name">${c.name}</div>
      <div class="cat-sub">${c.sub}</div>
      <div class="cat-count">${pool.length} spots</div>
    </div>`;
  }).join('');
}

// LIST VIEW
function showList(catId) {
  currentCat = catId; expanded = false;
  document.getElementById('home-view').style.display = 'none';
  document.getElementById('list-view').style.display = 'block';
  const cat = CATS.find(c => c.id === catId);

  const header = document.getElementById('app-header');
  header.innerHTML = `<button class="back-btn" onclick="renderHome()">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    All vibes
  </button>`;

  document.getElementById('list-title').textContent = cat.emoji + ' ' + cat.name;
  document.getElementById('list-sub').textContent = cat.sub;

  renderPlacesList();
  window.scrollTo(0, 0);
}

function renderPlacesList() {
  const catId = currentCat;
  const catNominations = (noms[catId] || []);
  let allPlaces = [...(PLACES[catId] || [])];
  catNominations.forEach(n => {
    if (!allPlaces.find(p => p.id === n.id)) allPlaces.push(n);
  });
  allPlaces.sort((a, b) => getScore(catId, b.id, b.score) - getScore(catId, a.id, a.score));

  const top10 = allPlaces.slice(0, 10);
  const rest = allPlaces.slice(10);

  let html = '';

  top10.forEach((p, i) => { html += buildPlaceCard(p, i, catId); });

  if (rest.length > 0) {
    if (!expanded) {
      html += `<div class="expand-row">
        <button class="expand-btn" onclick="toggleExpand()">
          <span class="expand-arrow" id="expand-arrow">▾</span>
          Show ${rest.length} more spots
        </button>
      </div>`;
    } else {
      rest.forEach((p, i) => { html += buildPlaceCard(p, i + 10, catId); });
      html += `<div class="expand-row">
        <button class="expand-btn" onclick="toggleExpand()">
          <span class="expand-arrow open" id="expand-arrow">▾</span>
          Show less
        </button>
      </div>`;
    }
  }

  html += `<div class="nominate-box">
    <div class="nom-title">🔍 Know a spot that belongs here?</div>
    <div class="nom-sub">Nominate it — get 5 upvotes to join the main list</div>
    <div class="nom-inputs">
      <input class="nom-input" id="nom-name" placeholder="Place name" autocomplete="off"/>
      <div class="nom-row">
        <input class="nom-input" id="nom-addr" placeholder="Neighborhood / Address" autocomplete="off" style="flex:1"/>
        <button class="nom-submit" onclick="nominatePlace('${catId}')">Add ↑</button>
      </div>
    </div>
  </div>`;

  document.getElementById('places-list').innerHTML = html;
}

function buildPlaceCard(p, i, catId) {
  const score = getScore(catId, p.id, p.score);
  const voteState = votes[catId + ':' + p.id] || null;
  const rankClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';
  const communityTag = p.community ? `<span class="community-badge">${(p.votes||0)<5?'pending':'community'}</span>` : '';
  const pendingClass = p.community && (p.votes||0) < 5 ? ' pending-place' : '';
  const scoreClass = score > p.score ? ' positive' : score < p.score ? ' negative' : '';
  const tags = (p.tags||[]).slice(0,3).map(t => `<span class="place-tag">${t}</span>`).join('');
  return `<div class="place-card${pendingClass}">
    <div class="place-rank ${rankClass}">${i+1}</div>
    <div class="place-info">
      <div class="place-name">${p.name}${communityTag}</div>
      <div class="place-desc">${p.desc}</div>
      <div class="place-addr">${p.addr||''}</div>
      <div class="place-tags">${tags}</div>
    </div>
    <div class="vote-col">
      <button class="vote-btn${voteState==='up'?' up-voted':''}" onclick="castVote('${catId}','${p.id}','up',${p.score})" aria-label="Upvote">▲</button>
      <div class="vote-score${scoreClass}">${score}</div>
      <button class="vote-btn${voteState==='dn'?' dn-voted':''}" onclick="castVote('${catId}','${p.id}','dn',${p.score})" aria-label="Downvote">▼</button>
    </div>
  </div>`;
}

function toggleExpand() {
  expanded = !expanded;
  renderPlacesList();
}

function castVote(catId, placeId, dir, base) {
  const key = catId + ':' + placeId;
  const prev = votes[key];
  if (prev === dir) { delete votes[key]; } else { votes[key] = dir; }
  saveVotes();

  const catNoms = noms[catId] || [];
  const nom = catNoms.find(n => n.id === placeId);
  if (nom) {
    if (dir === 'up' && prev !== 'up') nom.votes = (nom.votes||0) + 1;
    else if (dir === 'up' && prev === 'up') nom.votes = Math.max(0, (nom.votes||0) - 1);
    nom.community = true;
    saveNoms();
  }

  renderPlacesList();
  showToast(dir === 'up' ? '🔥 Voted up!' : '👎 Voted down');
}

function nominatePlace(catId) {
  const name = (document.getElementById('nom-name').value || '').trim();
  const addr = (document.getElementById('nom-addr').value || '').trim();
  if (!name) { showToast('Enter a place name first'); return; }
  if (!noms[catId]) noms[catId] = [];
  const id = 'nom-' + name.toLowerCase().replace(/[^a-z0-9]/g,'') + '-' + Date.now();
  noms[catId].push({ id, name, addr: addr || 'Austin, TX', desc: 'Community nomination — vote it up to confirm!', score: 0, votes: 0, tags: ['community'], community: true });
  saveNoms();
  renderPlacesList();
  showToast(`"${name}" nominated! Share to get it voted up 🙌`);
}

function shareList() {
  const cat = CATS.find(c => c.id === currentCat);
  const text = `Where should we go? Vote on the best ${cat.name} spots in Austin 🔥`;
  const url = window.location.href.split('?')[0] + '?vibe=' + currentCat;
  if (navigator.share) {
    navigator.share({ title: 'Austin Vibe — ' + cat.name, text, url }).catch(()=>{});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => showToast('Link copied! 📋'));
  } else {
    showToast('austinvibe.co/' + currentCat);
  }
}

// Handle deep link
(function() {
  const params = new URLSearchParams(window.location.search);
  const vibe = params.get('vibe');
  renderHome();
  if (vibe && CATS.find(c => c.id === vibe)) {
    showList(vibe);
  }
})();
</script>
